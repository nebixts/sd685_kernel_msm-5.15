name: Merge Latest CLO Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  merge-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          ref: codelinaro # Target your local 'codelinaro' branch
          fetch-depth: 0
          fetch-tags: true # Crucial to pull local repository tag metadata structures

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          # Links the upstream tracking directly to the Code Linaro Kernel Common Git Mirror
          git remote add clo-stable https://git.codelinaro.org/clo/la/kernel/msm-5.15.git
          git fetch clo-stable --tags --force

      - name: Auto-Detect & Safe Merge
        id: merge_step
        run: |
          echo "Scanning fetched remote tracking branches for latest release..."
          
          # Query remote branches instead of tags based on the explicit Git mirror log output
          LATEST_BRANCH=$(git branch -r | grep -E 'clo-stable/kernel\.lnx\.5\.15\.r[0-9]+-rel$' | sort -V | tail -n 1 | sed 's/^[[:space:]]*//')
          
          if [ -z "$LATEST_BRANCH" ]; then
             echo "❌ Error: No matching android13-5.15 release branches found on Code Linaro mirror."
             exit 1
          fi

          # Extract only the branch name without the remote alias prefix for issue tracking
          CLEAN_TAG_NAME=$(echo "$LATEST_BRANCH" | sed 's|clo-stable/||')

          echo "Found target CLO Release Branch: $LATEST_BRANCH"
          echo "tag=$CLEAN_TAG_NAME" >> $GITHUB_OUTPUT

          # Handle baseline stitching smoothly on the local 'codelinaro' branch using the remote branch reference
          if ! git merge-base codelinaro "$LATEST_BRANCH" > /dev/null; then
             echo "⚠️ Warning: Unrelated histories. Stitching baseline history..."
             git merge "$LATEST_BRANCH" --allow-unrelated-histories --no-edit
          else
             echo "Merging updates from $LATEST_BRANCH..."
             git merge "$LATEST_BRANCH" --no-edit
          fi

      - name: Push Changes
        run: git push origin codelinaro # Pushes directly back to your codelinaro target branch

      - name: Close Conflict Issue on Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]'
            });
            
            for (const issue of issues.data) {
              if (issue.title.includes('Merge Conflict: Stable CLO Kernel')) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  body: '✅ Conflict resolved by successful automated CLO merge.'
                });
              }
            }

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.merge_step.outputs.tag }}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge Conflict: Stable CLO Kernel ${tag || 'Unknown Tag'}`,
              body: `Automated merge of **${tag || 'android13-5.15 LTS'}** failed on your 'codelinaro' branch. Please resolve conflicts manually.`
            })
