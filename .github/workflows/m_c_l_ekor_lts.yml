name: Merge Latest CLO Kernel android13-5.15 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          ref: codelinaro 
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add clo-stable https://git.codelinaro.org/clo/la/kernel/msm-5.15.git
          git fetch clo-stable --tags --force

      - name: Auto-Detect & Safe Merge
        id: merge_step
        run: |
          echo "Scanning fetched remote tracking branches for latest release..."
          
          LATEST_BRANCH=$(git branch -r | grep -E 'clo-stable/.*kernel\.lnx\.5\.15\.r[0-9]+-rel' | sort -V | tail -n 1 | sed 's/^[[:space:]]*//')
          
          if [ -z "$LATEST_BRANCH" ]; then
             echo "❌ Error: No matching 5.15 release branches found on Code Linaro mirror."
             exit 1
          fi

          CLEAN_TAG_NAME=$(echo "$LATEST_BRANCH" | sed 's|clo-stable/||')
          echo "Found target CLO Release Branch: $LATEST_BRANCH"
          echo "tag=$CLEAN_TAG_NAME" >> $GITHUB_OUTPUT

          # Attempt standard merge
          if ! git merge-base HEAD "$LATEST_BRANCH" > /dev/null; then
             echo "⚠️ Warning: Unrelated histories. Stitching baseline history..."
             git merge "$LATEST_BRANCH" --allow-unrelated-histories --no-edit
          else
             echo "Merging updates from $LATEST_BRANCH..."
             git merge "$LATEST_BRANCH" --no-edit
          fi

      - name: Push Direct Changes
        if: success()
        run: git push origin HEAD:codelinaro 

      - name: Handle Merge Conflict via Pull Request
        if: failure() && steps.merge_step.outputs.tag != ''
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.merge_step.outputs.tag }}';
            const conflictBranch = `conflict-${tag}`;
            
            // 1. Abort the messy local merge and isolate conflict into a tracking branch
            core.info('Isolating merge failure context into dedicated reference branch...');
            await exec.exec('git', ['merge', '--abort']);
            await exec.exec('git', ['checkout', '-b', conflictBranch]);
            
            // 2. Force an environment merge to preserve the conflict states inside the repo index markers
            try {
              await exec.exec('git', ['merge', `clo-stable/${tag}`, '--no-edit']);
            } catch (err) {
              core.info('Conflict files generated successfully.');
            }
            
            // 3. Stage and push the conflict tracking branch markers up to GitHub
            await exec.exec('git', ['add', '.']);
            await exec.exec('git', ['-c', 'user.name="github-actions[bot]"', '-c', 'user.email="github-actions[bot]@users.noreply.github.com"', 'commit', '-m', `Expose conflicts for upstream ${tag}`]);
            await exec.exec('git', ['push', 'origin', `HEAD:${conflictBranch}`, '--force']);
            
            // 4. Verify if a Pull Request is already active for this tag sequence
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${conflictBranch}`
            });
            
            if (prs.data.length === 0) {
              core.info('Creating resolution Pull Request marker...');
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Merge Conflict: Upstream CLO ${tag}`,
                head: conflictBranch,
                base: 'codelinaro',
                body: `Automated integration of upstream updates from branch **${tag}** tracking failed with conflicts.\n\nPlease resolve conflict blocks manually directly inside this Pull Request.`
              });
            } else {
              core.info('Pull request already exists. Target updated.');
            }
            
