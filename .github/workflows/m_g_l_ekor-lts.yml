name: Merge Stable Kernel

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  merge-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          ref: google # <--- Target your branch here
          fetch-depth: 0 # Fetches all history for a proper merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add linux-stable https://kernel.org
          git fetch linux-stable --tags

      - name: Merge Tag 5.15.203
        run: |
          # Merges the specific stable tag into your current branch
          git merge v5.15.203 --no-edit --allow-unrelated-histories
          
      - name: Push Changes
        run: |
          git push origin google
