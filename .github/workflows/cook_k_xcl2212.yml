      - name: "🛠️ Setup KernelSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'KERNELSU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          # Cleanup previous attempts
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
    
          # Apply Core Kernel Patch (FS, MM, SELinux)
          echo "🔧 Applying SUSFS core kernel patch..."
          SUSFS_CORE_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          patch -p1 --forward < "$SUSFS_CORE_PATCH" || echo "⚠️ Core patch skipped"

          # Copy SUSFS Header & Source files
          echo "📂 Copying SUSFS source files..."
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/

          # Manual Integration (Bypass the broken .patch file)
          echo "🔧 Integrating SUSFS into KernelSU manually..."
          # Copy integration headers if they exist
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/
          fi

          # Inject include into sucompat.c
          if [ -f "KernelSU/kernel/sucompat.c" ]; then
            sed -i '/#include "ksu.h"/a #include <linux/susfs.h>' KernelSU/kernel/sucompat.c
            echo "✅ Injected susfs.h into sucompat.c"
          fi

          # Fix missing SUS_SU definitions in header
          cat >> include/linux/susfs_def.h << 'EOF'
          #ifndef SUS_SU_DISABLED
          #define SUS_SU_DISABLED 0
          #define SUS_SU_WITH_HOOKS 1
          #define SUS_SU_WITHOUT_HOOKS 2
          #endif
          EOF

          echo "🔧 Ensuring SUSFS is included in the build system..."
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-y += susfs.o" >> fs/Makefile
            echo "✅ Added susfs.o to fs/Makefile"
          fi

          # Create Symlink
          if [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../KernelSU/kernel drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi

          echo "🔗 Wiring KernelSU into the build system..."

          # Ensure we are in the correct directory
          DRIVER_MAKEFILE="drivers/Makefile"
          DRIVER_KCONFIG="drivers/Kconfig"

          # 1. Update Makefile
          if ! grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
            echo "obj-\$(CONFIG_KSU) += kernelsu/" >> "$DRIVER_MAKEFILE"
            echo "✅ Added KernelSU to drivers/Makefile"
          fi

          # 2. Update Kconfig
          if ! grep -q "drivers/kernelsu/Kconfig" "$DRIVER_KCONFIG"; then
          # Injects the source line before the last endmenu
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            echo "✅ Added KernelSU to drivers/Kconfig"
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i '/CONFIG_KSU/d' "$CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          echo "✔ KERNELSU configs with SUSFS added"

          rm -rf susfs4ksu
          
          echo "🎉 KERNELSU with SUSFS Setup Complete"

          echo "🔧 Adding SUSFS version reporting to KSU Makefile..."

          # Define the version you are using
          SUSFS_VERSION="v2.1.0"
          KSU_MAKEFILE="KernelSU/kernel/Makefile"

          if [ -f "$KSU_MAKEFILE" ]; then
          # Inject the SUSFS version into the compiler flags
          sed -i "s/^ccflags-y += -D$(grep -o 'KSU_VERSION=[0-9]*' $KSU_MAKEFILE)/& -DSUSFS_VERSION=\\\\\"$SUSFS_VERSION\\\\\"/" "$KSU_MAKEFILE"
    
          # Also add it to the printk log in KernelSU's init.c so it shows in dmesg
          INIT_FILE="KernelSU/kernel/core/init.c"
          if [ -f "$INIT_FILE" ]; then
            sed -i 's/pr_info("KernelSU version: %s\\n", KSU_VERSION);/pr_info("KernelSU version: %s | SUSFS version: %s\\n", KSU_VERSION, SUSFS_VERSION);/' "$INIT_FILE"
            echo "✅ Version reporting added to init.c"
          fi
            echo "✅ SUSFS version injected into Makefile"
          else
            echo "⚠️ Could not find KSU Makefile to inject version"
          fi

          # This will make the version appear in the 'cc1' command lines in the log
          export KCFLAGS="-DSUSFS_VERSION=\\\"v2.1.0\\\""

          
