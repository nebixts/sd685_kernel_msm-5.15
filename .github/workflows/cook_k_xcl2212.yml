            echo "✔ Created drivers/kernelsu symlink"
          fi
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "📝 Configuring $CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          echo "✔ KOWSU configs with SUSFS added"
          
          echo "✅ Installed KOWSU with SUSFS Successfully"
          
      
      - name: "🔧 Setup KernelSU Next"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'KSUN'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          # Clean up existing KSU if present
          rm -rf ./KernelSU/kernel ./drivers/kernelsu
        
          # Install KSUN
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
          echo "✔ KSUN installed successfully"
        
          echo "📦 Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
        
          echo "📂 Copying SUSFS source files..."
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ || true
    
          echo "🔧 Applying SUSFS kernel patch..."
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if patch -p1 --forward < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed or already applied"
          fi

          echo "🔧 Applying SUSFS -> KernelSU-Next integration..."
          # KernelSU Next often requires different integration than official KSU.
          # We copy the integration files first, then attempt to apply the patch.

          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/
            echo "✔ Copied SUSFS KernelSU integration files"
          fi

          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          
          if [ -d "KernelSU/kernel" ]; then
          (
          cd KernelSU/kernel
          echo "Current directory: $(pwd)"
            if patch -p1 --forward --fuzz=3 < "$KSU_PATCH"; then
              echo "✅ KSU patch successfully applied"
            else
            echo "⚠️ KSU patch failed - Proceeding with manual file copy logic"
            fi
          )
          else
          echo "❌ Error: KernelSU directory not found!"
          exit 1
          fi
        
          # Check if symlink is needed (Standard KSU uses drivers/kernelsu)
          if [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../KernelSU/kernel drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi
        
          # Configure Defconfig
          # Make sure env.DEFCONFIG_NAME is just the filename, not the full path
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "📝 Configuring $CONFIG_FILE"
        
          # Remove existing KSU configs to prevent duplicates if building dirty
          sed -i '/CONFIG_KSU/d' "$CONFIG_FILE"
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          echo "✔ KSUN configs with SUSFS added"
          
          rm -rf susfs4ksu

          echo "🎉 KSUN with SUSFS Integration complete!"

      - name: "🛠️ Setup KSUB with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'KSUB'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          rm -rf ./KernelSU ./drivers/kernelsu
          
          echo "📦 Installing KSUB..."
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
          
          #KBUILD_FILE="kernel/Makefile"
          #if [ -f "kernel/Kbuild" ]; then
          #  KBUILD_FILE="kernel/Kbuild"
          #fi
          
          echo "✔ KSUB installed successfully"
          
          echo "📦 Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          if [ ! -d "susfs4ksu" ]; then
            echo "❌ ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi
          
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          echo "🔧 Applying SUSFS kernel patch..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — copying files manually"
          fi

          echo "📄 Forcing SUSFS source injection..."

          mkdir -p fs
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          echo "✔ Copied fs/susfs.c"
          
          mkdir -p include/linux
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          echo "✔ Copied include/linux/susfs.h"
          
          if [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            echo "✔ Copied include/linux/susfs_def.h"
          else
            echo "⚠️ susfs_def.h not found in repo"
          fi

          echo "📦 Injecting SUSFS -> KernelSU integration files"
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/
            echo "✔ Copied SUSFS KernelSU integration files"
          fi

          echo "🔧 Applying SUSFS -> KernelSU patch..."
          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
      
          if [ -f "$KSU_PATCH" ]; then
            cd KernelSU
            if patch -p1 --dry-run < ../$KSU_PATCH >/dev/null; then
              patch -p1 < ../$KSU_PATCH && echo "✔ Applied KSU SUSFS patch"
              cd ..
            else
              echo "⚠️ KSU SUSFS patch failed — applying manual fallback with precise sed syntax"
              cd ..
              # FIX: Injects valid header inclusion and prevents compilation failure
              sed -i '/#include "ksu.h"/a #include <linux/susfs.h>' KernelSU/kernel/ksu.c
              sed -i '/ksu_core_init()/a \\tsusfs_init();' KernelSU/kernel/ksu.c
              echo "✔ Manually hooked susfs_init() inside ksu.c"
            fi
          else
            echo "⚠️ KSU_PATCH file not found — applying manual fallback with precise sed syntax"
            sed -i '/#include "ksu.h"/a #include <linux/susfs.h>' KernelSU/kernel/ksu.c
            sed -i '/ksu_core_init()/a \\tsusfs_init();' KernelSU/kernel/ksu.c
            echo "✔ Manually hooked susfs_init() inside ksu.c"
          fi
          echo "✔ Applied SUSFS -> KernelSU patch successfully"

          echo "🔍 Verifying SUSFS files..."
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h KernelSU/kernel/ksu.c; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done

          echo "🔍 Verifying and Registering SUSFS in Makefiles..."
          # Fix: Forces the obj-y registration into every potential fs/Makefile in your workspace
          MAKEFILES=$(find . -name "Makefile" | grep "fs/Makefile")
          for mfile in $MAKEFILES; do
            if ! grep -q "susfs.o" "$mfile"; then
              echo "obj-y += susfs.o" >> "$mfile"
              echo "✔ Registered susfs.o in $mfile"
            fi
          done

          # Fix: Ensure the functions are declared globally exported if LTO is active
          if [ -f "fs/susfs.c" ]; then
            if ! grep -q "EXPORT_SYMBOL" fs/susfs.c; then
              echo -e "\n#include <linux/export.h>\nEXPORT_SYMBOL(susfs_init);" >> fs/susfs.c
              echo "✔ Appended global EXPORT_SYMBOL to fs/susfs.c"
            fi
          fi
          
          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU/kernel drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi

          echo "⚠️ FORCING CONFIGURATIONS..."
          # FIX: Cleans out duplicate symbols across both variants of defconfigs to prevent overrides
          for CONF in "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" "arch/arm64/configs/gki_defconfig"; do
          if [ -f "$CONF" ]; then
              echo "📝 Configuring $CONF"
              sed -i '/CONFIG_KSU/d' "$CONF"
              sed -i '/CONFIG_KPROBES/d' "$CONF"
              sed -i '/CONFIG_KALLSYMS/d' "$CONF"
          fi
          done

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "📝 Configuring $CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          echo "✔ KSUB configs with SUSFS added"
          
          rm -rf susfs4ksu

          echo "🎉 KSUB with SUSFS Integration complete!"

      - name: "👍 Make defconfig"
        run: |
          TC_DIR="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/xclang-22.1.2"
          
          export PATH="$TC_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$TC_DIR/lib:$LD_LIBRARY_PATH"
          
          cd ${{ env.kernelDir }}/${{ env.kernelName }}
          make ${{ steps.generate-args.outputs.args }} ${{ env.DEFCONFIG_NAME }}

      # ====================== Begin Processing Build Kernel Stage ======================
      - name: "🛠️ Start Build Kernel 🪛"
        run: |
          export TOOLCHAIN_PATH="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/xclang-22.1.2"
          export PATH="$TOOLCHAIN_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLCHAIN_PATH/lib:$LD_LIBRARY_PATH"

          cd common_gki/common
          make -j$(nproc --all) \
               O=out \
               ARCH=arm64 \
               LLVM=1 \
               LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               KCFLAGS="-O3 -mllvm -polly -mllvm -polly-vectorizer=stripmine" \
               gki_defconfig

          make -j$(nproc --all) \
               O=out \
               ARCH=arm64 \
               LLVM=1 \
               LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               KCFLAGS="-O3 -mllvm -polly -mllvm -polly-vectorizer=stripmine"

      # ====================== Checking KSU-SUSFS PATCH Integration ======================
      #- name: "🧪 Verify SUSFS Integration"
        #run: |
          #cd ./${{ env.kernelDir }}/${{ env.kernelName }}/out/arch/arm64/boot/
          #echo "Checking Image for SUSFS..."
          #if strings Image | grep -q "susfs_"; then
            #echo "✅ SUSFS detected in Image!"
          #else
            #echo "❌ SUSFS NOT detected! Check your patch logs."
            #exit 1
          #fi
      
      # ====================== Begin Packaging the Kernel Stage ======================
      - name: "📂 Prepare Artifact"
        run: |
          cd ${{ env.kernelDir }}/${{ env.kernelName }}
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel Image found!"
            # Use matrix variant instead of hardcoded .ksu
            cp out/arch/arm64/boot/Image ${{ github.workspace }}/Image.${{ matrix.variant }}
          else
            echo "❌ Error: Kernel Image NOT found!"
            exit 1
          fi

      - name: 🔍 Check Space (Post-Build)
        if: always()
        run: |
          echo "Final disk space status:"
          df -h /
      
      - name: "♻️ Remove swapfile (cleanup)"
        if: always()
        run: |
 
          if [ -f /swapfile ]; then
            echo "Disabling and removing /swapfile..."
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile || true
   
            sudo sysctl -w vm.swappiness=60 || true
            echo "Swapfile removed."
          else
            echo "No /swapfile found - nothing to cleanup."
          fi

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ github.workspace }}/Image.${{ matrix.variant }}
          retention-days: 3
          
  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/
          merge-multiple: true

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%d-%m-%Y')
          git clone --depth=1 https://github.com/nebixts/AnyKernel3 -b master AnyKernel3
          rm -rf AnyKernel3/.git

          find ./kernels/ -name "Image.*" -type f -exec cp {} ./AnyKernel3/ \;
          
          KSU_INFO=""
          if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
            KSU_INFO="_${{ github.event.inputs.ksuVariant }}"
          fi
          ZIP_NAME="nefarian-xcl22-${{ github.event.inputs.kernelBranch }}${KSU_INFO}_${{ github.event.inputs.optimizationLevel }}_${{ github.event.inputs.tickRate }}hz_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" ./*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
