      - name: "👍 Make defconfig"
        run: |
          TC_DIR="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/xclang-22.1.2"
          
          export PATH="$TC_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$TC_DIR/lib:$LD_LIBRARY_PATH"
          
          cd ${{ env.kernelDir }}/${{ env.kernelName }}
          make ${{ steps.generate-args.outputs.args }} ${{ env.DEFCONFIG_NAME }}

      # ====================== Begin Processing Build Kernel Stage ======================
      - name: "🛠️ Start Build Kernel 🪛"
        run: |
          export TOOLCHAIN_PATH="$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/xclang-22.1.2"
          export PATH="$TOOLCHAIN_PATH/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLCHAIN_PATH/lib:$LD_LIBRARY_PATH"

          cd common_gki/common
          make -j$(nproc --all) \
               O=out \
               ARCH=arm64 \
               LLVM=1 \
               LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               KCFLAGS="-O3 -mllvm -polly -mllvm -polly-vectorizer=stripmine" \
               gki_defconfig

          make -j$(nproc --all) \
               O=out \
               ARCH=arm64 \
               LLVM=1 \
               LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               KCFLAGS="-O3 -mllvm -polly -mllvm -polly-vectorizer=stripmine"

      # ====================== Begin Packaging the Kernel Stage ======================
      - name: "📂 Prepare Artifact"
        run: |
          cd ${{ env.kernelDir }}/${{ env.kernelName }}
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel Image found!"
            # Use matrix variant instead of hardcoded .ksu
            cp out/arch/arm64/boot/Image ${{ github.workspace }}/Image.${{ matrix.variant }}
          else
            echo "❌ Error: Kernel Image NOT found!"
            exit 1
          fi

      - name: 🔍 Check Space (Post-Build)
        if: always()
        run: |
          echo "Final disk space status:"
          df -h /
      
      - name: "♻️ Remove swapfile (cleanup)"
        if: always()
        run: |
 
          if [ -f /swapfile ]; then
            echo "Disabling and removing /swapfile..."
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile || true
   
            sudo sysctl -w vm.swappiness=60 || true
            echo "Swapfile removed."
          else
            echo "No /swapfile found - nothing to cleanup."
          fi

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ github.workspace }}/Image.${{ matrix.variant }}
          retention-days: 3
          
  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/
          merge-multiple: true

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%d-%m-%Y')
          git clone --depth=1 https://github.com/nebixts/AnyKernel3 -b master AnyKernel3
          rm -rf AnyKernel3/.git

          find ./kernels/ -name "Image.*" -type f -exec cp {} ./AnyKernel3/ \;
          
          KSU_INFO=""
          if [ "${{ github.event.inputs.buildKSU }}" != "noksu" ]; then
            KSU_INFO="_${{ github.event.inputs.ksuVariant }}"
          fi
          ZIP_NAME="nefarian-xcl22-${{ github.event.inputs.kernelBranch }}${KSU_INFO}_${{ github.event.inputs.optimizationLevel }}_${{ github.event.inputs.tickRate }}hz_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" ./*
          cd ..
          echo "ZIP_FILENAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: NeFaRiaN-XCL22
          path: ${{ env.ZIP_FILENAME }}
          retention-days: 7
