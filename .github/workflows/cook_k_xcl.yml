name: "Cook_K_XCL22"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/nebixts/sd685_kernel_msm-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: choice
        default: "codelinaro"
        options:
          - "google"
          - "zepharo"
          - "codelinaro"
          - "topnotchfreaks"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: "-NeFaRiaN-3.4-C-10042026"
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "ksu"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuVariant:
        description: "KSU implementation (if KSU enabled)"
        required: true
        type: choice
        default: "NEXT"
        options:
          - "KERNELSU"
          - "WKSU"
          - "NEXT"
      optimizationLevel:
        description: "Compiler optimization level"
        required: false
        type: choice
        default: "O3"
        options:
          - "default"
          - "O2"
          - "O3"
          - "Os"
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: false
        type: choice
        default: "500"
        options:
          - "default"
          - "100"
          - "250"
          - "300"
          - "500"
          - "600"
          - "750"
          - "1000"
      bbg:
        description: "Baseband-guard Support (if KSU Enabled)"
        required: true
        type: choice
        default: "on"
        options:
          - "on"
          - "off"
      swapSizeGB:
        description: "Optional swap size in GB to create on the runner (set 0 to disable)"
        required: false
        type: string
        default: "8"
      
jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
          
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}
      
      # ====================== Start Preparation Stage ======================
    steps:
      - name: "✨ Setup WorkSpace"
        run: |
          mkdir -p ${{ env.kernelDir }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

          sudo apt-get update -qq
          sudo apt-get install -y \
            repo rsync aria2 build-essential bc curl flex cpio git zip \
            dwarves libelf-dev gcc-aarch64-linux-gnu libssl-dev python3 \
            clang lld llvm llvm-dev libxml2 libxml2-dev

          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          sudo apt install ./libtinfo5_6.3-2ubuntu0.1_amd64.deb
          rm libtinfo5_6.3-2ubuntu0.1_amd64.deb

      - name: 🔍 Check Space (Before CleanUp)
        run: |
          echo "Disk space before cleanup:"
          df -h /

      - name: 🧹 Aggressive CleanUp
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: 🔍 Check Space (After Cleanup)
        run: |
          echo "Disk space after cleanup:"
          df -h /

      - name: "🧰 Setup Swapfile (optional)"
        run: |
          SWAP_GB="${{ github.event.inputs.swapSizeGB }}"
          if [ -z "$SWAP_GB" ]; then
            SWAP_GB=0
          fi

          if [ "$SWAP_GB" != "0" ]; then
            echo "Requested swap: ${SWAP_GB}G"
            if [ -f /swapfile ]; then
              echo "Existing /swapfile found, disabling and removing..."
              sudo swapoff /swapfile || true
              sudo rm -f /swapfile
            fi

            if command -v fallocate >/dev/null 2>&1; then
              echo "Creating swapfile with fallocate..."
              sudo fallocate -l ${SWAP_GB}G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
            else
              echo "fallocate not available, creating swapfile with dd..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
            fi

            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo sysctl -w vm.swappiness=10 || true

            echo "SWAP_CREATED=true" >> $GITHUB_ENV
            echo "/swapfile created and activated (size: ${SWAP_GB}G)"
          else
            echo "No swap requested (swapSizeGB=${SWAP_GB})"
          fi
      
      # ====================== Source Code Preparation Stage ======================
      - name: "🖥️ Clone Kernel Source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "⚙️ Initialize Toolchains Repo"
        run: |
          set -e  # Exit on errors
      
          get_latest_github_release() {
            local repo_url="$1"
            latest_url=$(curl -sL "https://api.github.com/repos/$repo_url/releases/latest" | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
            
            if [[ -z "$latest_url" ]]; then
              echo "❌ Failed to fetch latest release from $repo_url!"
              exit 1
            fi
      
            printf "%s" "$latest_url"
          }
      
          clang_url=$(get_latest_github_release "Xtra-Manager-Software/XClang-Binaries")
      
          echo "✅ Clang URL: $clang_url"
      
          mkdir -p clang
      
          if [[ "$clang_url" == *.tar.gz ]]; then
            echo "🚀 Downloading latest Clang from: $clang_url..."
            wget --progress=bar:force -O "clang/clang.tar.gz" "$clang_url" || { echo "❌ Failed to download Clang!"; exit 1; }
      
            echo "📦 Extracting Clang..."
            tar -xf clang/clang.tar.gz -C clang || { echo "❌ Extraction failed!"; exit 1; }
            rm -f clang/clang.tar.gz
          else
            echo "🚀 Cloning Clang from $clang_url..."
            git clone --recursive --depth=1 "$clang_url" clang || { echo "❌ Cloning failed!"; exit 1; }
          fi
      
          if [ -d "clang/bin" ]; then
            CLANG_PATH="${{ github.workspace }}/clang/bin"
          else
            CLANG_PATH=$(find clang -type d -name "bin" | head -n 1)
            CLANG_PATH="${{ github.workspace }}/${CLANG_PATH}"
          fi
      
          if [ ! -f "$CLANG_PATH/clang" ]; then
            echo "❌ Clang binary not found in $CLANG_PATH! Build might fail."
            ls -R clang
            exit 1
          fi
      
          echo "✅ Using Clang from $CLANG_PATH"
          echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
          echo "$CLANG_PATH" >> $GITHUB_PATH
      
          export PATH="$CLANG_PATH:$PATH"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CC=clang
          export AR="llvm-ar"
          export AS="llvm-as"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          
          echo "⚙️ Using Clang version:"
          clang --version || echo "❌ Clang not found in PATH!"

          TC_ROOT="${CLANG_PATH%/bin}"
          TC_LIB_DIR="$TC_ROOT/lib"
          
          echo "🔧 Fixing libxml2 in $TC_LIB_DIR..."
          mkdir -p "$TC_LIB_DIR"
          
          ln -sf /usr/lib/x86_64-linux-gnu/libxml2.so.2 "$TC_LIB_DIR/libxml2.so.16"
          
          echo "LD_LIBRARY_PATH=$TC_LIB_DIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          
          echo "✅ Toolchain setup complete."
          
      - name: "📐 Setup SWAP 24GB"
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 24

      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "😎 Set args for GKI kernels"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
            args="-j$(nproc --all)"
            if [ -n "${{ env.OUT_DIR }}" ]; then
              mkdir -p $(pwd)/${{ env.OUT_DIR }}
              args="$args O=$(pwd)/${{ env.OUT_DIR }}"
            fi
            
            args="$args ARCH=arm64 LLVM=1 LTO=thin"
            args="$args CROSS_COMPILE=aarch64-linux-gnu-"
            args="$args CLANG_TRIPLE=aarch64-linux-gnu-"
            
            args="$args KCFLAGS='-O3 -mllvm -polly -mllvm -polly-vectorizer=stripmine'"
            
            echo "args=$args" >> $GITHUB_OUTPUT

      - name: "📝 Append custom Makefile line"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-uninitialized-const-pointer' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-sometimes-uninitialized' >> Makefile
         echo "Custom Makefile line added successfully"
            
      - name: "⚙️ Configure Kernel Optimization and TickRate"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}";
          
          apply_patch() {
            local url="$1";
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }
          
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3/d' "$CONFIG_FILE"
          sed -i '/CONFIG_CC_OPTIMIZE_FOR_SIZE/d' "$CONFIG_FILE"
          
          case "${{ github.event.inputs.optimizationLevel }}" in
            default)
              ;;
            O2)
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              ;;
            O3)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set" >> "$CONFIG_FILE"
              
              patch -p1 "https://raw.githubusercontent.com/nebixts/kernel_patches/main/add_-03.patch"
          
              grep "KBUILD_CFLAGS += -O3" Makefile || (echo "Patch failed!" && exit 1)
              ;;
            Os)
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set" >> "$CONFIG_FILE"
              echo "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" >> "$CONFIG_FILE"
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$CONFIG_FILE"
              ;;
          esac
        
              patch -p1 "https://raw.githubusercontent.com/nebixts/kernel_patches/main/custom_tickrate_options.patch"
          
          case "${{ github.event.inputs.tickRate }}" in
            default)
              echo Nothing to change. Keep Default.
              ;;
            100)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=100" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_100=y" >> "$CONFIG_FILE"
              ;;
            250)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=250" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_250=y" >> "$CONFIG_FILE"
              ;;
            300)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=300" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_300=y" >> "$CONFIG_FILE"
              ;;
            500)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=500" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_500=y" >> "$CONFIG_FILE"
              ;;
            600)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=600" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_600=y" >> "$CONFIG_FILE"
              ;;
            750)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_500=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_600=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_750=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=750" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_750=y" >> "$CONFIG_FILE"
              ;;
            1000)
              sed -i '/^CONFIG_HZ_100=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_250=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_300=/d' "$CONFIG_FILE"
              sed -i '/^CONFIG_HZ_1000=/d' "$CONFIG_FILE"
              echo "CONFIG_NO_HZ_IDLE=y" >> "$CONFIG_FILE"
              echo "CONFIG_HZ=1000" >> "$CONFIG_FILE"
              echo "CONFIG_HZ_1000=y" >> "$CONFIG_FILE"
              ;;
          esac
          
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n\"" >> "$CONFIG_FILE"
          fi
          
          echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y >> $CONFIG_FILE"
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
          echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          EOF
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          EOF
          
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          EOF
        
          apply_patch "https://raw.githubusercontent.com/nebixts/kernel_patches/main/0001-scripts-sign-builds.patch"
          
          echo "✅ Applied -${{ github.event.inputs.optimizationLevel }} Optimization"
          echo "✅ Applied ${{ github.event.inputs.tickRate }}Hz tick rate"
          echo "✅ Applied Full Meta Module Support"
          echo "✅ Applied Extra TCP configs"
          echo "✅ Applied Networking Configuration"
          echo "✅ Applied IPSet Support"

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.variant == 'ksu' && github.event.inputs.bbg == 'on'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          echo "Adding BBG...";
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      # ====================== Begin Processing Root Kernel  base of KernelSU Stage ======================
      - name: "🔧 Setup KernelSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'KERNELSU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          # Cleanup previous attempts
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
    
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          echo "🔧 Applying SUSFS kernel patch..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — copying files manually"
          fi

          echo "🔧 Applying SUSFS -> KernelSU patch..."
          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          
          echo "📄 Forcing SUSFS source injection..."
          
          mkdir -p fs
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          echo "✔ Copied fs/susfs.c"
          
          mkdir -p include/linux
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          echo "✔ Copied include/linux/susfs.h"
          
          if [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            echo "✔ Copied include/linux/susfs_def.h"
          else
            echo "⚠️ susfs_def.h not found in repo"
          fi
          
          echo "🔍 Verifying SUSFS files..."
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done

          # Register in fs/Makefile
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-y += susfs.o" >> fs/Makefile
          fi
          echo "✔ Applied Register fs/Makefile successfully"
          

          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          echo "✔ KERNELSU configs with SUSFS added"

          rm -rf susfs4ksu
          
          echo "🎉 KERNELSU with SUSFS Setup Complete"
    
      - name: "🛠️ Setup Wild KSU with SUSFS"
        if: matrix.variant == 'ksu' && github.event.inputs.ksuVariant == 'WKSU'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          rm -rf ./KernelSU ./drivers/kernelsu ./Wild_KSU
          
          echo "📦 Installing Wild KSU..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary
          
          if [ ! -d "Wild_KSU" ]; then
            echo "❌ ERROR: Wild_KSU directory not found after installation!"
            exit 1
          fi
          echo "✔ Wild-KSU installed successfully"
          
          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15
          
          if [ ! -d "susfs4ksu" ]; then
            echo "❌ ERROR: SUSFS4KSU clone failed!"
            exit 1
          fi
          
          echo "🔧 Applying SUSFS kernel patch..."
          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          if [ -f "$SUSFS_PATCH" ]; then
            if patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "✅ SUSFS kernel patch applied successfully"
            else
              echo "⚠️ Patch had some issues, but continuing..."
            fi
          else
            echo "⚠️ SUSFS patch file not found: $SUSFS_PATCH"
          fi
          
          echo "📄 Installing SUSFS source files..."
          mkdir -p fs include/linux
          
          if [ -f "susfs4ksu/kernel_patches/fs/susfs.c" ]; then
            cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
            echo "✔ Copied fs/susfs.c"
          else
            echo "❌ ERROR: fs/susfs.c not found in SUSFS repo!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
            echo "✔ Copied include/linux/susfs.h"
          else
            echo "❌ ERROR: include/linux/susfs.h not found!"
            exit 1
          fi
          
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs_def.h" ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            echo "✔ Copied include/linux/susfs_def.h"
          else
            echo "⚠️ susfs_def.h not found, might not be needed"
          fi

          # Register in fs/Makefile
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-y += susfs.o" >> fs/Makefile
          fi
          echo "✔ Applied Register fs/Makefile successfully"
          
          echo "📦 Integrating SUSFS with Wild-KSU..."
          
          if [ -d "susfs4ksu/kernel_patches/KernelSU/kernel" ]; then
            cp -rf susfs4ksu/kernel_patches/KernelSU/kernel/* Wild_KSU/kernel/ || true
            echo "✔ Copied SUSFS integration files to Wild_KSU/kernel/"
          fi
          
          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          KSU_C_FILE="Wild_KSU/kernel/ksu.c"
          
          if [ ! -f "$KSU_C_FILE" ]; then
            echo "❌ ERROR: $KSU_C_FILE not found!"
            exit 1
          fi
          
          echo "🔧 Integrating SUSFS into KSU initialization..."
          
          if grep -q "susfs_init" "$KSU_C_FILE" 2>/dev/null; then
            echo "⚠️ SUSFS already integrated in ksu.c, skipping"
          else
            PATCH_SUCCESS=0
            if [ -f "$KSU_PATCH" ]; then
              cd Wild_KSU
              if patch -p1 --forward --dry-run < "../$KSU_PATCH" >/dev/null 2>&1; then
                patch -p1 < "../$KSU_PATCH" && PATCH_SUCCESS=1
                echo "✔ Applied KSU SUSFS patch successfully"
              fi
              cd ..
            fi
            
            if [ $PATCH_SUCCESS -eq 0 ]; then
              echo "⚠️ Patch failed or unavailable, applying manual integration..."
              
              if ! grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
                sed -i '/#include <linux\/fs\.h>/a #include <linux/susfs.h>' "$KSU_C_FILE"
                echo "✔ Added #include <linux/susfs.h>"
              fi
              
              if ! grep -q "susfs_init()" "$KSU_C_FILE"; then
                sed -i '/ksu_core_init();/a \\tsusfs_init();' "$KSU_C_FILE" || \
                sed -i '/int __init ksu_init(/,/^}/{ /return 0;/i \\tsusfs_init(); }' "$KSU_C_FILE"
                echo "✔ Added susfs_init() call"
              fi
            fi
          fi
          
          echo "🔍 Verifying SUSFS integration..."
          VERIFICATION_FAILED=0
          
          for file in fs/susfs.c include/linux/susfs.h; do
            if [ -f "$file" ]; then
              echo "✔ Found: $file"
            else
              echo "❌ MISSING: $file"
              VERIFICATION_FAILED=1
            fi
          done
          
          if grep -q "susfs_init" "$KSU_C_FILE"; then
            echo "✔ susfs_init() call verified in ksu.c"
          else
            echo "❌ MISSING: susfs_init() call in ksu.c"
            VERIFICATION_FAILED=1
          fi
          
          if grep -q "#include <linux/susfs.h>" "$KSU_C_FILE"; then
            echo "✔ susfs.h include verified in ksu.c"
          else
            echo "❌ MISSING: susfs.h include in ksu.c"
            VERIFICATION_FAILED=1
          fi
          
          if [ $VERIFICATION_FAILED -eq 1 ]; then
            echo "❌ SUSFS integration verification FAILED!"
            echo "Dumping ksu.c header for debugging:"
            head -30 "$KSU_C_FILE"
            exit 1
          fi
          
          if [ ! -L "drivers/kernelsu" ] && [ ! -d "drivers/kernelsu" ]; then
            ln -sf ../Wild_KSU drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          echo "✔ Wild KSU configs with SUSFS added"

          rm -rf susfs4ksu
          
          echo "🎉 Wild KSU with SUSFS kernel patches fully integrated!"

      - name: "🛠️ Setup NEXT with SUSFS"
